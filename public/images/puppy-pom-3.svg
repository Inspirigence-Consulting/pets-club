<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2d1b3d"/>
      <stop offset="100%" stop-color="#0f0f1a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#c8923a" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="60%">
      <stop offset="50%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/></filter>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="softGlow"><feGaussianBlur stdDeviation="1.5"/></filter>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <rect width="600" height="600" fill="url(#glow)"/>
  <!-- Bokeh -->
  <g filter="url(#blur)" opacity="0.5">
    <circle cx="120" cy="80" r="35" fill="#c8923a" opacity="0.08"/>
    <circle cx="480" cy="150" r="45" fill="#e8c06a" opacity="0.06"/>
    <circle cx="70" cy="400" r="30" fill="#8b6914" opacity="0.09"/>
    <circle cx="520" cy="350" r="50" fill="#ffdfaa" opacity="0.05"/>
    <circle cx="200" cy="500" r="25" fill="#a07828" opacity="0.07"/>
    <circle cx="400" cy="80" r="40" fill="#c8923a" opacity="0.06"/>
    <circle cx="350" cy="480" r="35" fill="#e8c06a" opacity="0.08"/>
    <circle cx="550" cy="520" r="28" fill="#8b6914" opacity="0.07"/>
  </g>
  <!-- Dog silhouette -->
  <g filter="url(#softGlow)">
    <ellipse cx="300" cy="440" rx="90" ry="12" fill="black" opacity="0.3"/>
    <ellipse cx="300" cy="340" rx="88" ry="70" fill="#1c1c1c" stroke="#333" stroke-width="2"/>
    <ellipse cx="300" cy="300" rx="68" ry="48" fill="#2a2a2a" opacity="0.4"/>
    <ellipse cx="300" cy="365" rx="48" ry="24" fill="#d4a04a" opacity="0.5"/>
    <rect x="248" y="395" width="22" height="35" rx="10" fill="#1c1c1c"/>
    <rect x="330" y="395" width="22" height="35" rx="10" fill="#1c1c1c"/>
    <path d="M370,300 Q400,260 385,240 Q370,225 358,245" fill="#1c1c1c" stroke="#333" stroke-width="1.5"/>
    <circle cx="365" cy="242" r="14" fill="#1c1c1c"/>
    <circle cx="300" cy="235" r="48" fill="#1c1c1c" stroke="#333" stroke-width="2"/>
    <circle cx="300" cy="228" r="36" fill="#2a2a2a" opacity="0.35"/>
    <path d="M268,215 L258,178 L284,205 Z" fill="#1c1c1c" stroke="#333" stroke-width="1"/>
    <path d="M332,215 L342,178 L316,205 Z" fill="#1c1c1c" stroke="#333" stroke-width="1"/>
    <ellipse cx="282" cy="232" rx="8" ry="8.5" fill="#1a1008"/>
    <ellipse cx="318" cy="232" rx="8" ry="8.5" fill="#1a1008"/>
    <circle cx="285" cy="229" r="3" fill="white" opacity="0.7"/>
    <circle cx="321" cy="229" r="3" fill="white" opacity="0.7"/>
    <ellipse cx="300" cy="250" rx="7" ry="5" fill="#111"/>
    <path d="M296,255 Q300,262 304,255" fill="none" stroke="#222" stroke-width="1.2"/>
  </g>
  <rect width="600" height="600" fill="url(#vig)"/>
  <rect width="600" height="600" filter="url(#grain)" opacity="0.25"/>
  <text x="300" y="545" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#e8c06a" opacity="0.8">Milo</text>
  <text x="300" y="567" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#e8c06a" opacity="0.55">Spitz Nain - Black &amp; Tan</text>
</svg>
